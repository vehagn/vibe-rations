# An explosion 300 m under a free surface in a homogeneous half-space, recorded by a line of
# receivers along the surface. Runs in under a minute.
#
#   just run examples/explosion.toml
#
# Positions are in metres from the first grid node; z points down and the free surface is
# at z = 0.

[grid]
points = [101, 101, 67]  # nodes along x, y and z
spacing = 12.0           # metres; or one per axis, [dx, dy, dz]

[time]
duration = 0.8  # seconds; dt follows from the stability limit (see `just check`)

# Eighth-order stencils at 0.3 of the stability limit are the defaults: about 4.5 grid points
# per shortest wavelength keep the misfit near 1% after ten wavelengths (README, "Accuracy").
# Fourth order (`order = 4`) is faster per step but needs nearly twice the points.
[scheme]
order = 8
# Removing leapfrog's time error from the traces allows 0.85 of the limit, as accurate in 2.8
# times fewer steps; snapshots stay warped (README, "Accuracy").
# remove_time_dispersion = true

[boundary]
pml_width = 15       # nodes of absorbing layer on the sides and bottom
free_surface = true

[[model.layer]]
top = 0.0
vp = 3000.0
vs = 1730.0
rho = 2400.0

[[source]]
position = [600.0, 600.0, 300.0]
explosion = 1e13  # peak moment rate, N·m/s (the Ricker wavelet peaks at 1)
wavelet = { kind = "ricker", frequency = 12.0 }

[receivers]
components = ["vx", "vz"]

[[receivers.line]]
from = [180.0, 600.0, 0.0]
to = [1020.0, 600.0, 0.0]
count = 71  # one per node between the absorbing layers

# The vertical section through the source, every 50 ms. Red is down (positive z).
[[snapshot]]
field = "vz"
plane = "xz"
at = 600.0
interval = 0.05

[output]
dir = "out/explosion"
