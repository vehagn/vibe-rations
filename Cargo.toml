[package]
name = "vibe-rations"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "3D elastic seismic wave simulator: a staggered-grid finite-difference solver with CPML boundaries and a free surface"
license = "BSD-3-Clause"
publish = false

[workspace]
members = [".", "web"]

[[bin]]
name = "vibe-rations"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line program, with the run server and its client; the web app builds the
# library without them.
cli = ["dep:clap", "dep:tiny_http", "dep:ureq"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
png = "0.18"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
toml = "1"
# Plain HTTP only: the client reaches servers through SSH tunnels, which encrypt.
ureq = { version = "3", default-features = false, optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

# The physics tests run whole simulations; unoptimised they take minutes.
[profile.test]
opt-level = 3
