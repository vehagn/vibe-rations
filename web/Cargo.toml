[package]
name = "vibe-rations-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The vibe-rations solver in the browser, through WebAssembly"
license = "BSD-3-Clause"
publish = false

[lib]
# cdylib for the browser; rlib so the unit tests run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
serde_json = "1"
vibe-rations = { path = "..", default-features = false }
# Must match the wasm-bindgen CLI exactly: WASM_BINDGEN_VERSION in .devcontainer/Containerfile
# and web/Containerfile.
wasm-bindgen = "=0.2.130"
