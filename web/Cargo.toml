[package]
name = "vibe-rations-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The vibe-rations solver in the browser, through WebAssembly"
license = "BSD-3-Clause"
publish = false

[lib]
# cdylib for the browser; rlib so the unit tests run natively.
crate-type = ["cdylib", "rlib"]

[features]
# Rayon across Web Workers. Needs a std built with atomics (a nightly toolchain and
# -Z build-std) and a cross-origin-isolated page; web/build.sh builds this variant next to the
# single-threaded one, and the page picks whichever the browser can run.
threads = ["dep:wasm-bindgen-rayon"]

[dependencies]
anyhow = "1"
serde_json = "1"
vibe-rations = { path = "..", default-features = false }
# Must match the wasm-bindgen CLI exactly: WASM_BINDGEN_VERSION in .devcontainer/Containerfile
# and web/Containerfile.
wasm-bindgen = "=0.2.130"
wasm-bindgen-rayon = { version = "1.3", optional = true }
