# static-web-server settings for the web app (https://static-web-server.net). The image sets
# SERVER_CONFIG_FILE to this file; `just serve` mounts it.

[general]
port = 8080
root = "/public"
log-level = "warn"
compression = true
# The headers below decide caching.
cache-control-headers = false
# GET /health answers 200, for the probes.
health = true

[advanced]

[[advanced.headers]]
source = "**"
[advanced.headers.headers]
# Cross-origin isolation: multithreaded WebAssembly needs SharedArrayBuffer, which needs these.
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "require-corp"
# Revalidate every time, so a new version shows up at once; unchanged files cost a 304.
Cache-Control = "no-cache"
X-Content-Type-Options = "nosniff"
