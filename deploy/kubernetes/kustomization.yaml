# The web app for a cluster with the Gateway API: `kubectl apply -k deploy/kubernetes`, or
# copy into a GitOps repository. Set the image tag and the hostname in http-route.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vibe-rations

resources:
  - ns.yaml
  - deployment.yaml
  - svc.yaml
  - http-route.yaml

images:
  - name: ghcr.io/vehagn/vibe-rations-web
    newTag: main
